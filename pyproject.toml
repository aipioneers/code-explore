[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-explore"
version = "0.3.0"
description = "Developer knowledge base CLI — scan, index, and search your programming projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Tobias Oberrauch", email = "tobias.oberrauch@gmail.com" },
]
keywords = [
    "cli",
    "code-search",
    "developer-tools",
    "knowledge-base",
    "project-indexer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "lancedb>=0.4.0",
    "pyarrow>=14.0.0",
    "gitpython>=3.1.0",
    "tomli_w>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["code_explore"]

[tool.hatch.build]
artifacts = ["code_explore/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/aipioneers/code-explore"
Repository = "https://github.com/aipioneers/code-explore"
Issues = "https://github.com/aipioneers/code-explore/issues"

[project.scripts]
cex = "code_explore.cli.main:app"
code-explore = "code_explore.cli.main:app"
