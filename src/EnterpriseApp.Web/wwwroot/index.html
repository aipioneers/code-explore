<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnterpriseApp</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="EnterpriseApp.Web.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading EnterpriseApp...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger" style="display: none; position: fixed; bottom: 0; width: 100%; z-index: 1000;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" style="cursor: pointer; margin-left: 10px;">Dismiss</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Dismiss error UI
        document.querySelector('.dismiss')?.addEventListener('click', function() {
            document.getElementById('blazor-error-ui').style.display = 'none';
        });
    </script>
</body>
</html>
